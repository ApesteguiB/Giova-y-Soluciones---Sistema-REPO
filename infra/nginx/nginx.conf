# ---------------------------------------------------------------------------
# GIOVA / Soluciones — proxy público (Nginx)
#
# Dos sitios en un mismo contenedor, elegidos por dominio:
#   * GIOVA       -> giova.pe (y localhost): portada Angular + sistema interno.
#   * Soluciones  -> solucionesinformatica.com.pe (y soluciones.localhost):
#                    portada, catálogo, intranet y facturador estáticos; el
#                    sistema interno (/operaciones) es la misma app Angular.
# Lo común a ambos (cabeceras de seguridad, API, límites) vive en
# /etc/nginx/giova/comun.conf para que no puedan desalinearse.
# ---------------------------------------------------------------------------

server_tokens off;

# Límites por IP. Son deliberadamente holgados: en Docker Desktop todos los
# clientes llegan con la IP de la pasarela, y la API ya limita por usuario los
# intentos de acceso y los formularios públicos.
limit_req_zone $binary_remote_addr zone=giova_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=giova_forms:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=giova_api:10m   rate=50r/s;
limit_req_status 429;

# HSTS solo cuando la petición llegó por HTTPS a un proxy TLS situado delante.
map $http_x_forwarded_proto $giova_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}
# Esquema real que se informa a la API.
map $http_x_forwarded_proto $giova_proto {
    default $scheme;
    https   https;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_vary on;

# ---------------------------------------------------------------- GIOVA ----
server {
    listen 80 default_server;
    server_name giova.pe www.giova.pe localhost giova.localhost _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/giova/comun.conf;

    # Direcciones cortas para compartir.
    location = /catalogo   { return 302 /productos; }
    location = /intranet   { return 302 /trabajadores/login; }
    location = /facturador { return 302 /giova/facturador.html; }

    # Facturador de GIOVA y copia del sitio de Soluciones (útil en localhost).
    location = /giova      { return 301 /giova/; }
    location /giova/       { try_files $uri $uri/ =404; }
    location = /soluciones { return 301 /soluciones/; }
    location /soluciones/  { try_files $uri $uri/ =404; }

    # Aplicación Angular (portada, catálogo y sistema interno).
    location / { try_files $uri $uri/ /index.html; }
}

# ----------------------------------------------------------- SOLUCIONES ----
server {
    listen 80;
    server_name solucionesinformatica.com.pe www.solucionesinformatica.com.pe
                soluciones.localhost www.soluciones.localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/giova/comun.conf;

    # Páginas propias de Soluciones. Se sirven desde /soluciones/ con
    # ubicaciones exactas para que el respaldo de Angular (/index.html) nunca
    # pueda caer por error en la portada estática.
    location = /                { try_files /soluciones/index.html =404; }
    location = /index.html      { try_files /soluciones/index.html =404; }
    location = /catalogo        { try_files /soluciones/catalogo.html =404; }
    location = /catalogo.html   { try_files /soluciones/catalogo.html =404; }
    location = /intranet        { try_files /soluciones/intranet.html =404; }
    location = /intranet.html   { try_files /soluciones/intranet.html =404; }
    location = /facturador      { try_files /soluciones/facturador.html =404; }
    location = /facturador.html { try_files /soluciones/facturador.html =404; }
    location /soluciones/       { try_files $uri =404; }

    # Sistema interno y demás rutas: aplicación Angular.
    location / { try_files $uri $uri/ @angular; }
    location @angular { rewrite ^ /app.html break; }
}
