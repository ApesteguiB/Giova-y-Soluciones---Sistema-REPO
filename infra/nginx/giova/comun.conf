# Configuración común a todos los sitios. Se incluye dentro de cada server{}.

# Límite del proxy apenas por encima de los 10 MiB que acepta el backend.
client_max_body_size 12m;

# --- Cabeceras de seguridad -------------------------------------------------
# Nginx solo hereda add_header si el bloque hijo no declara ninguna; por eso
# las ubicaciones que agregan Cache-Control vuelven a incluir cabeceras.conf.
include /etc/nginx/giova/cabeceras.conf;

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "UP\n";
}

# --- API ---------------------------------------------------------------------
location = /api/v1/auth/login {
    limit_req zone=giova_login burst=20 nodelay;
    include /etc/nginx/giova/api.conf;
}
location = /api/v1/contact-submissions {
    limit_req zone=giova_forms burst=10 nodelay;
    include /etc/nginx/giova/api.conf;
}
location = /api/v1/claims {
    limit_req zone=giova_forms burst=10 nodelay;
    include /etc/nginx/giova/api.conf;
}
location ^~ /api/ {
    limit_req zone=giova_api burst=200 nodelay;
    include /etc/nginx/giova/api.conf;
}

# El volumen de documentos del backend no pertenece a esta imagen: una ruta
# adivinada no debe caer en el index de la aplicación.
location ^~ /storage/ { return 404; }

# Archivos ocultos, respaldos y fuentes que jamás deben servirse.
location ~ /\.(?!well-known/) { return 404; }
location ~* \.(?:bak|sql|env|log|ini|sh|ps1|map)$ { return 404; }

# Archivos con huella en el nombre: no cambian nunca, se pueden cachear.
location ~* ^/(?:main|chunk|styles|polyfills)-[A-Z0-9]+\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/giova/cabeceras.conf;
}
location ^~ /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/giova/cabeceras.conf;
}
location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/giova/cabeceras.conf;
}
