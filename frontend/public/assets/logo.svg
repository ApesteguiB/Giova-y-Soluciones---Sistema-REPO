      <stop offset="0" stop-color="#17A9AE"/>
      <stop offset="1" stop-color="#0E8C97"/>
    </linearGradient>
  </defs>
  <!-- Monograma GR entrelazado -->
  <text x="2" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#lg)">G</text>
  <text x="34" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#lg)">R</text>
  <!-- Texto -->
  <text x="92" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#3A3F45">Giova</text>
  <text x="92" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="400" fill="#4A5057">Representaciones</text>
