<main class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <a routerLink="/" class="login-logo"
      ><img [src]="site.logoSrc()" [alt]="site.brandName()" (error)="site.logoLoadFailed()"
    /></a>
    <span class="eyebrow">Área interna</span>
    <h1 id="login-title">Acceso de operaciones</h1>
    <p>Ingrese con la cuenta de trabajador habilitada para administrar el catálogo.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="username">Usuario</label>
      <input id="username" formControlName="username" autocomplete="username" maxlength="254" />
      <small
        class="field-error"
        *ngIf="form.controls.username.invalid && form.controls.username.touched"
        >Ingrese su usuario.</small
      >
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      <small
        class="field-error"
        *ngIf="form.controls.password.invalid && form.controls.password.touched"
        >Ingrese su contraseña.</small
      >
      <div class="login-error" *ngIf="error()" role="alert">{{ error() }}</div>
      <button type="submit" class="btn btn-primary" [disabled]="sending()">
        {{ sending() ? 'Validando...' : 'Ingresar' }}
      </button>
    </form>
    <a routerLink="/" class="back-link">Volver al sitio público</a>
  </section>
</main>
